Descriptor:
  Name: AzureRBACInventoryAgent
  DisplayName: Azure RBAC Inventory Agent
  Description: Lists Azure subscriptions, shows who has Azure RBAC role assignments on them, and resolves principal IDs to human-readable names in one deterministic workflow.

AgentDefinitions:
  - Name: AzureRBACInventoryAgent
    DisplayName: Azure RBAC Inventory Agent
    Description: Lists Azure subscriptions, shows who has role assignments on them, and resolves user/service principal/group IDs to readable names — chaining the Azure Resource Manager and Microsoft Graph skills deterministically instead of relying on ad hoc orchestrator tool selection.
    Publisher: Custom
    Product: SecurityCopilot
    RequiredSkillsets:
      - AzureRBACInventoryAgent
      - AzureARMInventoryPOC
      - EntraPrincipalResolver
    AgentSingleInstanceConstraint: None
    Triggers:
      - Name: Default
        DefaultPollPeriodSeconds: 0
        ProcessSkill: AzureRBACInventoryAgent.AzureRBACInventoryAgent
    PromptSkill: AzureRBACInventoryAgent.AzureRBACInventoryAgent

SkillGroups:
  - Format: AGENT
    Skills:
      - Name: AzureRBACInventoryAgent
        DisplayName: Azure RBAC Inventory Agent
        Description: Lists Azure subscriptions, role assignments, and resolves principal names via Microsoft Graph.
        Interfaces:
          - InteractiveAgent
        Inputs:
          - Name: UserRequest
            Description: The user's question about Azure subscriptions, RBAC access, or who holds a given role.
            DefaultValue: ''
            Required: true
        SuggestedPrompts:
          - Prompt: List all Azure subscriptions in my tenant.
            Title: List Subscriptions
            Personas:
              - 6
            IsStarterAgent: true
          - Prompt: Who has role assignments on my subscription, with their real names?
            Title: Who Has Access (With Names)
            Personas:
              - 6
            IsStarterAgent: true
          - Prompt: Show me everyone with Owner access across my subscription.
            Title: Find Owners
            Personas:
              - 6
            IsStarterAgent: true
          - Prompt: Give me more detail on one of those principals.
          - Prompt: Export this as a table.
          - Prompt: Check another subscription.
        Settings:
          OrchestratorSkill: DefaultAgentOrchestrator
          Instructions: >
            # Mission
            You are an Azure governance assistant. You answer questions about Azure subscriptions and who has
            Azure RBAC access to them, always resolving raw Entra object IDs into real, human-readable names
            before presenting results to the user.

            # Workflow
            1. If the user needs the list of subscriptions, call AzureARMInventoryPOC.ListAzureSubscriptions.
            2. If the user asks who has access/role assignments on a subscription, call
               AzureARMInventoryPOC.ListSubscriptionRoleAssignments for that subscription ID.
            3. For every unique principalId returned in step 2, resolve its name based on principalType:
               - principalType "User" -> call EntraPrincipalResolver.ResolveEntraUserById
               - principalType "ServicePrincipal" -> call EntraPrincipalResolver.ResolveEntraServicePrincipalById
               - principalType "Group" -> call EntraPrincipalResolver.ResolveEntraGroupById
               Always perform this resolution one principal at a time, never batch multiple different
               principal types into a single request.
            4. Merge the results into one final table: Principal Name | Principal Type | Role | Scope.
               Never show a raw unresolved GUID in the final answer if a name could be resolved.
            5. If a principal cannot be resolved, label it "Unresolved (<principalId>)" rather than omitting it.

            # Output
            Always return a single merged, readable table. Do not return intermediate raw ID tables to the user.
        ChildSkills:
          - AzureARMInventoryPOC.ListAzureSubscriptions
          - AzureARMInventoryPOC.ListSubscriptionRoleAssignments
          - EntraPrincipalResolver.ResolveEntraUserById
          - EntraPrincipalResolver.ResolveEntraServicePrincipalById
          - EntraPrincipalResolver.ResolveEntraGroupById
